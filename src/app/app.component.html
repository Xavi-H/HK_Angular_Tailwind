<app-header (canviSeccio)="seccio = $event" /> <!-- Quan header emiteix un event es guarda el valor aen la variable seccio-->

<main>
  @switch (seccio) {
    @case ('inici') { <app-inici (canviSeccio)="seccio = $event" /> }
    @case ('personatges') { <app-personatge /> }
    @case ('historia') { <app-historia /> }
  }
</main>

<app-footer />
